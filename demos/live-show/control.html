<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Worm Print 直播彩排台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M9 8h9a6 6 0 0 1 0 12h-5v5H9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 12V5h14v7M9 25H5V12h22v13h-4M9 20h14v5H9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 16h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span><strong>Worm Print</strong><small>直播彩排台</small></span>
    </div>
    <div class="topbar-status">
      <span class="local-badge"><i></i><span id="voice-state">本机自动讲解</span></span>
    </div>
  </header>

  <main class="workbench">
    <aside class="control-deck" aria-label="彩排控制台">
      <div class="deck-intro">
        <p class="kicker">弹幕驱动 · 真实操作</p>
        <h1>让弹幕指挥<br>一张标签纸</h1>
        <p>输入观众会说的话，设计器会真实执行，并把每一步展示出来。</p>
      </div>

      <form id="danmaku-form" class="danmaku-form">
        <label for="danmaku-input">模拟一条观众弹幕</label>
        <div class="input-row">
          <input id="danmaku-input" name="text" maxlength="80" autocomplete="off" placeholder="例如：看看价签打印" required>
          <button class="send-button" type="submit" aria-label="发送弹幕">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>

      <div class="quick-section">
        <div class="section-heading"><h2>试试这些指令</h2><span>点击即发送</span></div>
        <div class="quick-grid">
          <button type="button" data-command="看看快递面单">做一张面单</button>
          <button type="button" data-command="把标题改成 Worm Print 直播演示">改标题</button>
          <button type="button" data-command="绑定字段">绑定字段</button>
          <button type="button" data-command="文字居中">文字居中</button>
          <button type="button" data-command="预览出纸">预览出纸</button>
          <button type="button" data-command="这个软件能做什么">还能做什么</button>
        </div>
      </div>

      <div class="sample-section">
        <div class="section-heading"><h2>模板直通车</h2><span>覆盖当前画布</span></div>
        <div id="sample-list" class="sample-list"></div>
      </div>

      <div class="playback-section">
        <p class="loop-note">模板视频 → 面单预览 → 标签拼版 → 资产标签预览</p>
        <div class="playback-actions">
          <button id="demo-button" class="primary-button" type="button">开始连续演示</button>
          <button id="pause-button" class="stop-button" type="button" disabled>暂停</button>
        </div>
      </div>
    </aside>

    <section class="monitor" aria-label="演示监视器">
      <div class="monitor-head">
        <div><p class="kicker">正在演示</p><h2>设计器实时画面</h2></div>
        <div class="run-state" id="run-state"><i></i><span>等待指令</span></div>
      </div>

      <figure class="stage">
        <div class="stage-registration top-left"></div>
        <div class="stage-registration top-right"></div>
        <div class="stage-registration bottom-left"></div>
        <div class="stage-registration bottom-right"></div>
        <img id="stage-image" src="/api/preview" alt="打印设计器实时演示画面">
        <video id="template-video" src="/assets/template-loop.webm" muted playsinline preload="auto" hidden></video>
        <div id="stage-loading" class="stage-loading">正在打开真实设计器…</div>
      </figure>

      <div class="facts" aria-label="当前模板状态">
        <div><span>当前模板</span><strong id="fact-sample">正在读取</strong></div>
        <div><span>画布元素</span><strong id="fact-elements">—</strong></div>
        <div><span>出纸页数</span><strong id="fact-pages">—</strong></div>
      </div>

      <section class="activity" aria-labelledby="activity-title">
        <div class="activity-head">
          <div><p class="kicker">互动回执</p><h2 id="activity-title">弹幕与执行记录</h2></div>
          <span id="queue-state">队列空闲</span>
        </div>
        <div id="activity-list" class="activity-list" aria-live="polite">
          <div class="empty-state"><strong>还没有弹幕</strong><span>从左侧发一条“看看快递面单”试试。</span></div>
        </div>
      </section>
    </section>
  </main>

  <footer class="footer-note">彩排不会连接抖音、不会推流，也不会触发实体打印。接入真实直播前，请先确认官方弹幕权限。</footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
