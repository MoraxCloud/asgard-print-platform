name: Mirror to Gitee

# GitHub 为代码单一源：每次 push 到 master（或手动触发）后把全部 refs 镜像到 Gitee，
# 替代本地双端推送。--mirror 会同步所有分支与标签，并删除 Gitee 上 GitHub 已不存在的 ref，
# 即 Gitee 严格跟随 GitHub。两端 owner 不同：GitHub=worm-longliu，Gitee=liulong_oschina。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含全部分支与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 镜像全部 refs 到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          GITEE_OWNER="liulong_oschina"
          GITEE_REPO="worm-print-platform"
          MIRROR_URL="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          git remote add gitee-mirror "$MIRROR_URL"
          # --mirror：强制同步 refs/heads/* 与 refs/tags/*，并清理 Gitee 上多余 ref。
          git push --mirror gitee-mirror
