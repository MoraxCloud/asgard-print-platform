name: Publish npm

# 临时补发 workflow（跑完即恢复原版）：
# v1.6.2 首发链在 marketplace 处因缺 repository 字段 E422 中断，
# core / plugin-kit / canvas / echarts / skills 已发成功。
# 本版本从修复提交 0adb504 检出，只构建并发布 marketplace / i18n。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签（如 v1.6.0，需已推送到远端）'
        required: true
        type: string
      dry_run:
        description: '只打包干跑，不上传'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（临时固定到 repository 修复提交）
        uses: actions/checkout@v4
        with:
          ref: 0adb5047e8d008c3c8af7354dc18a318a984c089

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: npm ci

      - name: 构建 marketplace 与 i18n
        run: |
          npm run build -w @worm-print-platform/marketplace
          npm run build -w @worm-print-platform/i18n

      - name: 校验标签与包版本一致
        run: |
          TAG="${{ inputs.tag }}"
          TAG="${TAG#v}"
          PACKAGES="marketplace i18n"
          for pkg in $PACKAGES; do
            VER=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$VER" != "$TAG" ]; then
              echo "::error::$pkg 版本 $VER 与标签 $TAG 不一致"
              exit 1
            fi
          done
          echo "标签与补发包版本一致：$TAG"

      - name: 发布 @worm-print-platform/marketplace
        working-directory: packages/marketplace
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          npm publish --access public --registry=https://registry.npmjs.org $EXTRA

      - name: 发布 @worm-print-platform/i18n
        working-directory: packages/i18n
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          npm publish --access public --registry=https://registry.npmjs.org $EXTRA